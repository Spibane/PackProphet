name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Build and test a pull request, without publishing it. Nothing checked a branch before it
  # reached main, so a merge was the first time the runner saw it -- which is how a card snapshot
  # refresh with 21 failing tests got as far as a red deploy on the live site.
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt one mid-publish.
#
# A pull request gets its own group, and must: sharing `pages` would let a PR build sit in front of
# a real deploy, holding the publish queue for a run that publishes nothing. Superseded PR builds
# ARE cancelled, since a new commit makes the previous check pointless.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Required: InvariantGlobalization forces native relinking, which needs this.
      # Without it the build fails outright rather than silently skipping the step.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      # Both projects: the engine suite, and the render suite that covers the pages.
      - name: Test
        run: dotnet test --configuration Release

      # The app is served from the root of packprophet.spibane.com, so the base href committed in
      # index.html is already right and nothing rewrites it. It used to be rewritten to /<repo>/,
      # which is what project-page hosting needs and what a custom domain must not have: every
      # asset would be fetched from /PackProphet/_framework/ on a host that has no such path, and
      # the site would come up blank.
      #
      # Checked rather than assumed. This is a one-character edit away from shipping a blank page
      # on every route, and the deploy would report success either way.
      - name: Base href is the domain root
        run: |
          grep -q '<base href="/" />' src/PackProphet.App/wwwroot/index.html \
            || { echo "::error::index.html must carry <base href=\"/\" /> for custom-domain hosting"; exit 1; }

      # Cloud sync points at a Supabase project, and the two files that name it ship with
      # placeholders so a clone of this repository builds the local-only app rather than one wired
      # to somebody else's database. The real values live in repository VARIABLES, not secrets: the
      # browser has to send the anon key to Supabase on every request, so it is public the moment
      # the site is deployed, and filing it as a secret would only dress that up. What keeping it
      # out of the tree does buy is a rotation that costs a settings change rather than a commit,
      # and a git history that never carried it.
      #
      # Both files, or neither. The key alone is useless while index.html's connect-src still names
      # the placeholder host, because the browser blocks the request before it is ever made.
      #
      # Unset variables are a supported state rather than a failure: the deploy ships with sync
      # switched off, which is what a fork wants.
      #
      # PACKPROPHET_SYNC_PROXY takes precedence over both, and is the shape to prefer: the worker
      # in workers/sync-proxy holds the key, so the deployed app carries no credential at all and
      # requests over the rate are refused before Supabase is reached. See that folder's readme.
      - name: Point sync at the project
        env:
          SYNC_URL: ${{ vars.PACKPROPHET_SYNC_URL }}
          SYNC_KEY: ${{ vars.PACKPROPHET_SYNC_KEY }}
          SYNC_PROXY: ${{ vars.PACKPROPHET_SYNC_PROXY }}
          SETTINGS: src/PackProphet.App/wwwroot/appsettings.json
          INDEX: src/PackProphet.App/wwwroot/index.html
        run: |
          set -euo pipefail

          if [ -n "${SYNC_PROXY}" ]; then
            host=${SYNC_PROXY#https://}
            host=${host%/}
            export HOST="${host}"

            python3 -c "import json, os; p = os.environ['SETTINGS']; d = json.load(open(p)); d['Sync']['ProxyUrl'] = os.environ['SYNC_PROXY']; open(p, 'w').write(json.dumps(d, indent=2) + '\n')"
            python3 -c "import os; p = os.environ['INDEX']; t = open(p).read(); open(p, 'w').write(t.replace('YOUR-PROJECT.supabase.co', os.environ['HOST']))"

            # The key must NOT have been written. A build that carried both would send the app's
            # requests through the worker and hand anyone reading the page the means to go round it.
            python3 -c "import json, os, sys; d = json.load(open(os.environ['SETTINGS'])); sys.exit(0 if not d['Sync'].get('AnonKey') else 1)" \
              || { echo "::error::a proxied build must ship no anon key"; exit 1; }

            grep -q "${host}" "${INDEX}" || { echo "::error::connect-src does not name ${host}"; exit 1; }
            echo "sync proxied through ${host}"
            exit 0
          fi

          if [ -z "${SYNC_URL}" ] || [ -z "${SYNC_KEY}" ]; then
            echo "::notice::PACKPROPHET_SYNC_URL/KEY not set - deploying with cloud sync off"
            exit 0
          fi

          echo "::warning::deploying with the anon key in the page - see workers/sync-proxy"

          host=${SYNC_URL#https://}
          host=${host%/}
          export HOST="${host}"

          # Python rather than sed for both: the key is arbitrary text that would otherwise need
          # escaping for the shell and the replacement both, and `sed -i` takes a mandatory
          # argument on BSD and none on GNU, so a one-liner that works on the runner cannot be
          # tried on a Mac first.
          python3 -c "import json, os; p = os.environ['SETTINGS']; d = json.load(open(p)); d['Sync']['Url'] = os.environ['SYNC_URL']; d['Sync']['AnonKey'] = os.environ['SYNC_KEY']; open(p, 'w').write(json.dumps(d, indent=2) + '\n')"

          python3 -c "import os; p = os.environ['INDEX']; t = open(p).read(); open(p, 'w').write(t.replace('YOUR-PROJECT.supabase.co', os.environ['HOST']))"

          # Verified rather than assumed, for the same reason the base href above is: a deploy that
          # substituted only one of the two would report success and serve an app whose sync
          # silently never works.
          if grep -q 'YOUR-PROJECT' "${SETTINGS}" "${INDEX}"; then
            echo "::error::sync placeholders survived substitution"
            exit 1
          fi

          grep -q "${host}" "${INDEX}" || { echo "::error::connect-src does not name ${host}"; exit 1; }
          echo "sync configured for ${host}"

      # The notice bar's authored channel, for the things the app cannot work out for itself: an
      # outage, a feature that has started failing, or a pack that launched before the card database
      # published it. The app derives the rest from its own data and needs nothing set here.
      #
      # A variable rather than a secret, and for a weaker reason than the sync key's: a gist's raw
      # URL is in the page either way. What keeping it out of the tree buys is repointing the feed
      # without a commit.
      #
      # The host is already in connect-src, so only the URL is substituted -- and the host is
      # gist.githubusercontent.com for everyone, not a per-user one, so there is no placeholder to
      # verify the way the sync step has to.
      #
      # Unset is a supported state: no request is made and only the derived notices can appear.
      - name: Point the notice bar at its gist
        env:
          NOTICE_GIST: ${{ vars.PACKPROPHET_NOTICE_GIST }}
          SETTINGS: src/PackProphet.App/wwwroot/appsettings.json
        run: |
          set -euo pipefail

          if [ -z "${NOTICE_GIST}" ]; then
            echo "::notice::PACKPROPHET_NOTICE_GIST not set - only derived notices can appear"
            exit 0
          fi

          # Refused rather than trimmed, and the revision SHA is the specific thing being refused.
          # A gist's raw URL comes in two shapes -- .../raw/<file> serves the latest edit and
          # .../raw/<sha>/<file> serves that revision forever -- and the browser's copy button hands
          # you the second one. Pasted here, the feed is frozen at whatever it said that day, which
          # is the one failure this whole channel exists to avoid and is invisible while it happens:
          # the app fetches successfully and shows a stale notice, or none.
          #
          # python3 -c rather than a heredoc, matching the sync step above: a heredoc inside a YAML
          # block scalar carries the block's own indentation into the script, and Python refuses an
          # indented first statement.
          python3 -c "import os, re, sys, urllib.parse; u = urllib.parse.urlparse(os.environ['NOTICE_GIST']); parts = [p for p in u.path.split('/') if p]; sys.exit('::error::PACKPROPHET_NOTICE_GIST must be a https gist raw URL') if (u.scheme, u.netloc) != ('https', 'gist.githubusercontent.com') or 'raw' not in parts else None; sys.exit('::error::PACKPROPHET_NOTICE_GIST carries a revision SHA, so it would serve that revision forever - use the .../raw/<file> form') if any(re.fullmatch(r'[0-9a-f]{40}', p) for p in parts[parts.index('raw') + 1:]) else None"

          python3 -c "import json, os; p = os.environ['SETTINGS']; d = json.load(open(p)); d['Notice']['GistUrl'] = os.environ['NOTICE_GIST']; open(p, 'w').write(json.dumps(d, indent=2) + '\n')"

          grep -q 'gist.githubusercontent.com' src/PackProphet.App/wwwroot/index.html \
            || { echo "::error::connect-src does not name gist.githubusercontent.com"; exit 1; }
          echo "notice feed configured"

      - name: Publish
        run: dotnet publish src/PackProphet.App/PackProphet.App.csproj -c Release -o build

      # Card art for the sets the art CDN has not published yet.
      #
      # Card data and card art come from the same author in two repositories on two cadences, so
      # the newest set's data arrives days or weeks before its art -- and until the art lands,
      # every card in the set people are actually opening draws as a placeholder. The art does
      # exist by then, attached to the database repository's release as one ~400 MB zip, and the
      # script reads about 6 MB of it by ranged request.
      #
      # AFTER publish, and that ordering is the whole design:
      #
      #   * added before publish, the files would be fingerprinted by the static-asset pipeline and
      #     renamed out from under the URLs ArtSource builds;
      #   * added before publish, they would also land in service-worker-assets.js, where the
      #     integrity check below would then be verifying files this step wrote rather than files
      #     the build produced;
      #   * and nothing here is ever committed, so the repository does not grow by a set every
      #     month -- at 12.5 sets and ~103 MB a year, a decade of vendored art would otherwise be
      #     1.2 GB of git history for files the working tree does not even hold.
      #
      # Never fatal. A CDN that is briefly unavailable must not block a deploy: the app falls back
      # to the remote chain, which is where it looked before any of this existed.
      # The card-data release this deploy was built against, resolved once and written into the
      # site, so .github/workflows/card-data.yml can tell from outside whether the live site is
      # behind a release. Resolved rather than read off the vendored snapshot: the art below comes
      # from the live card list, and that is the thing a new release changes.
      - name: Record the card-data release
        id: release
        run: |
          version=$(curl -fsSL https://registry.npmjs.org/pokemon-tcg-pocket-database/latest \
                    | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$version" > build/wwwroot/card-data-release.txt
          echo "built against card data $version"

      - name: Vendor the art upstream has not published yet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/vendor-gap-art.py --out build/wwwroot/art --release "${{ steps.release.outputs.version }}"

      # GitHub Pages runs Jekyll by default, which silently DROPS directories whose
      # names start with an underscore — including _framework. Without this file the
      # deploy "succeeds" and serves a blank page with no useful error.
      - name: Disable Jekyll
        run: touch build/wwwroot/.nojekyll

      # The custom domain, carried in the artifact so it travels with what is published rather
      # than living only in the repository settings.
      - name: Custom domain
        run: |
          test -f build/wwwroot/CNAME || { echo "::error::CNAME missing from the publish output"; exit 1; }
          cat build/wwwroot/CNAME

      # Guards the ordering above. An integrity mismatch here means the service worker will
      # refuse to install and offline support is gone, which is invisible from the served
      # site — so it has to fail the build instead.
      - name: Verify the service worker manifest matches what shipped
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, sys

          manifest = open('build/wwwroot/service-worker-assets.js', encoding='utf-8').read()
          body = manifest[manifest.index('{'):manifest.rindex('}') + 1]
          assets = json.loads(body)['assets']

          bad = []
          for asset in assets:
              try:
                  data = open('build/wwwroot/' + asset['url'], 'rb').read()
              except FileNotFoundError:
                  bad.append(f"missing: {asset['url']}")
                  continue
              digest = 'sha256-' + base64.b64encode(hashlib.sha256(data).digest()).decode()
              if digest != asset['hash']:
                  bad.append(f"hash changed after publish: {asset['url']}")

          if bad:
              for line in bad:
                  print(f'::error::{line}')
              sys.exit(1)

          print(f'{len(assets)} precached assets verified')
          PY

      # Pages has no SPA rewrite rule, so a deep link like /collection 404s. Serving
      # index.html as the 404 page lets the Blazor router take over.
      - name: SPA fallback
        run: cp build/wwwroot/index.html build/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/wwwroot

  deploy:
    needs: build
    # The build above is the check; this is the publish, and a pull request wants the first
    # without the second.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
