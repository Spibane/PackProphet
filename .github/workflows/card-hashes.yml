name: Refresh card art fingerprints and types

# The screenshot import recognises a card by comparing it against a fingerprint of its artwork, and
# those fingerprints are committed rather than fetched — generating one means downloading the art.
# Everything else about a new set reaches users without a deploy, because card data comes live from
# the community CDN. Fingerprints cannot, so this closes the gap: it looks for cards the table has
# never seen, fingerprints those and only those, and opens a pull request when it found any.
#
# The distinction that matters, and the reason this is a scheduled job rather than a release step:
# a set's CARD data appears upstream days or weeks before all of its ART does. Running weekly means
# each visit picks up whatever art has landed since the last one, and a set that arrives half-drawn
# is completed by a later run rather than being stuck at whatever the first attempt managed.

on:
  schedule:
    # Weekly, early Monday UTC. Sets do not arrive faster than that, and each run is a few hundred
    # requests to a public CDN at most.
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-fingerprint every card, not only the ones with no fingerprint'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: card-hashes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The set this job most needs is the one the art CDN cannot give it.
      #
      # A set's card DATA is published within days and its ART is a manual commit weeks later, so
      # the newest set — the only one with cards this table has never seen — is reliably the one
      # whose art 404s. B4a is the worked example: card data on 2026-08-27, art still absent a week
      # later, and 0 of its 110 cards fingerprinted or typed as a result.
      #
      # The art does exist by then, inside the database repository's release archive, and the
      # deploy already extracts it from there with this same script. So both jobs wanted the same
      # bytes and fetched them separately, and one of them was fetching them from a place that did
      # not have them. This runs the extraction first and hands the generator the directory.
      #
      # Never fatal, for the same reason it is not in the deploy: the script exits 0 with a warning
      # when it cannot reach either source, and a generator given an empty directory falls back to
      # the CDN exactly as it did before this step existed.
      - name: Vendor the art the CDN has not published yet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/vendor-gap-art.py --out /tmp/gap-art

      # By path, not through the solution. CardHashGen is deliberately not in PackProphet.slnx so
      # that the deploy workflow's `dotnet test` never restores a native image decoder it has no
      # use for.
      #
      # --cards points at the VENDORED snapshot, not the CDN the generator defaults to.
      #
      # Without it this job fingerprints whatever the community database holds today while the app
      # loads a snapshot committed weeks ago, and the two drift. CommittedArtHashesTests is written
      # to catch exactly that -- "a generator that read different card data than the app loads" --
      # and it did: a run added eight new PROMO-B cards, a set the snapshot already knew, so they
      # were not a whole new set the table is allowed to run ahead by. They were eight fingerprints
      # naming cards the app had never heard of, and the deploy went red.
      #
      # Reading the snapshot makes the two agree by construction. New cards get fingerprinted on
      # the first run after the snapshot is refreshed, which is the right order: the app cannot use
      # a fingerprint for a card it does not know about.
      - name: Generate
        run: |
          dotnet run --project tools/CardHashGen/CardHashGen.csproj -c Release -- \
            --cards src/PackProphet.App/wwwroot/data/snapshot/cards.min.json \
            --out src/PackProphet.App/wwwroot/data/card-hashes.txt \
            --art-dir /tmp/gap-art \
            --report /tmp/coverage.json \
            ${{ inputs.full && ' ' || '--only-missing' }}

      # The stamp in the header changes on every run, so it is not evidence of anything. Only a
      # change to a fingerprint line means new art was found — otherwise this exits quietly rather
      # than opening a pull request a maintainer has to close every Monday.
      # The type table rides along: it is written from the same decode as the fingerprints, so it
      # costs the run nothing beyond 36 pixel samples a card. Checked separately from the
      # fingerprints because the two cover different cards -- only a card's base printing has the
      # plain header a badge can be read from, while every printing gets a fingerprint.
      - name: Did the types change
        id: types
        run: |
          if git diff --quiet -- src/PackProphet.App/wwwroot/data/card-types.txt; then
            echo "types=none" >> "$GITHUB_OUTPUT"
          else
            added=$(git diff --numstat -- src/PackProphet.App/wwwroot/data/card-types.txt | awk '{print $1}')
            removed=$(git diff --numstat -- src/PackProphet.App/wwwroot/data/card-types.txt | awk '{print $2}')
            # Same reasoning as the fingerprints: three header lines, one of which is the stamp.
            if [ "$added" = "1" ] && [ "$removed" = "1" ]; then
              echo "types=stamp" >> "$GITHUB_OUTPUT"
            else
              echo "types=changed" >> "$GITHUB_OUTPUT"
              echo "types: $added line(s) added, $removed removed"
            fi
          fi

      - name: Did anything actually change
        id: changed
        run: |
          if git diff --quiet -- src/PackProphet.App/wwwroot/data/card-hashes.txt; then
            echo "changed=none" >> "$GITHUB_OUTPUT"
            echo "no change at all"
            exit 0
          fi

          added=$(git diff --numstat -- src/PackProphet.App/wwwroot/data/card-hashes.txt | awk '{print $1}')
          removed=$(git diff --numstat -- src/PackProphet.App/wwwroot/data/card-hashes.txt | awk '{print $2}')
          # Three lines of header, and the stamp is one of them. A diff of exactly one line each way
          # is the date and nothing else.
          if [ "$added" = "1" ] && [ "$removed" = "1" ]; then
            echo "changed=stamp" >> "$GITHUB_OUTPUT"
            echo "only the generated-on date moved"
            exit 0
          fi

          echo "changed=fingerprints" >> "$GITHUB_OUTPUT"
          echo "$added line(s) added, $removed removed"

      - name: Summarise coverage
        if: steps.changed.outputs.changed == 'fingerprints' || steps.types.outputs.types == 'changed'
        id: summary
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          report = json.load(open('/tmp/coverage.json'))
          gaps = [s for s in report['sets'] if s['have'] < s['want']]

          lines = [
              f"Fingerprinted {report['fetchedNow']} card(s) this run.",
              f"The table now holds {report['fingerprints']} fingerprints, stamped {report['generated']}.",
              "",
          ]

          # Worth saying out loud, because it is the difference between a set this job can see and
          # one it cannot: art the CDN has not published, read out of the release archive instead.
          if report.get('fromDisk'):
              lines.append(f"{report['fromDisk']} of those came from the release archive rather "
                           "than the art CDN, which has not published them yet.")
              lines.append("")

          if gaps:
              # Named, not counted. A set at 4/120 is art that has not been published yet and will
              # be picked up by a later run; a set at 118/120 is two cards that will never exist.
              # The difference matters to whoever reads the pull request, and only the numbers show it.
              lines.append("Sets the table still does not cover completely:")
              lines.append("")
              lines.append("| set | fingerprinted | cards |")
              lines.append("|---|---:|---:|")
              lines += [f"| {s['set']} | {s['have']} | {s['want']} |" for s in gaps]
              lines.append("")
              lines.append("A set far short of its card count is art that upstream has not "
                           "published yet; the next scheduled run will pick it up.")
          else:
              lines.append("Every card in every set now has a fingerprint.")

          body = "\n".join(lines)
          print("body<<EOF_BODY")
          print(body)
          print("EOF_BODY")
          PY

      - name: Open a pull request
        if: steps.changed.outputs.changed == 'fingerprints' || steps.types.outputs.types == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ steps.summary.outputs.body }}
        run: |
          base="${{ github.event.repository.default_branch }}"
          # One branch, not one per run. A refresh nobody has merged yet should grow on the next
          # Monday rather than opening a second pull request beside the first.
          branch="chore/card-hashes"

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add src/PackProphet.App/wwwroot/data/card-hashes.txt \
                  src/PackProphet.App/wwwroot/data/card-types.txt
          git commit -m 'Fingerprint the card art that has appeared since the last run'

          # A bare --force-with-lease reads the branch's remote-tracking ref, and this checkout has
          # none: it is a shallow clone of the base branch, fetching that branch alone. Git then
          # rejects the push as stale info rather than falling back to a plain one, which is what
          # broke this step. Naming the value the lease expects asks the same question -- has
          # anything else written this branch since -- without needing a ref to read it from.
          # An empty answer means the branch is not there at all, and a first push cannot be forced.
          remote_sha=$(git ls-remote --heads origin "$branch" | awk '{print $1}')
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "$branch"
          else
            git push origin "$branch"
          fi

          # Reuse an open pull request from the same branch rather than stacking a new one every
          # week: an unmerged refresh should grow, not multiply.
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body "$BODY"
            echo "updated the existing pull request"
          else
            gh pr create --base "$base" --head "$branch" \
              --title 'Fingerprint the card art that has appeared since the last run' \
              --body "$BODY"
          fi
