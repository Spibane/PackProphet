<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- A meta tag rather than a header, because GitHub Pages serves static files and gives no
         way to set one. That costs frame-ancestors, which meta CSP ignores; everything below
         applies normally.

         What this actually buys, and what it does not. script-src has to keep 'unsafe-inline':
         the .NET SDK injects a fingerprinted import map inline on every build, so its hash
         changes with each publish and could not be pinned by hand. 'wasm-unsafe-eval' is what
         the WebAssembly runtime needs. So this is not primarily an XSS control - and the app has
         close to no injection surface anyway, since the only raw markup it renders is a QR SVG
         built entirely from integers.

         The value is in the NETWORK directives. Every card image and every dataset comes from one
         community CDN over which this project has no control, and default-src plus connect-src
         mean that even a tampered dataset cannot reach any other host: no beacon, no exfiltration,
         no third-party script. img-src needs data: because a screenshot is handed to the QR
         decoder as a data URL, and blob: because a backup is downloaded as one. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https://cdn.jsdelivr.net;
        connect-src 'self' https://cdn.jsdelivr.net;
        font-src 'self';
        manifest-src 'self';
        worker-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PackProphet</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <!-- Colours the browser chrome around the page. The DEFAULT skin's light page colour, so a cold
         start is already right for most people before any script runs; theme.js replaces it for the
         other three skin-and-brightness combinations.

         The manifest's theme_color matches this. Its background_color does not: it is #4338ca, the
         indigo of the app icon's own tile, so the launch screen and the icon agree.

         Worth recording what that value does NOT do, because it looks like it should. iOS insets the
         icon inside a white tile in the Add to Home Screen PREVIEW sheet, and background_color has
         no effect on it: a control served with these exact declarations and one served with the page
         colour were added side by side on an iPhone and both previewed inset and both landed on the
         home screen correctly, full-bleed. Declaring purpose:maskable icons did not change the
         preview either. So the preview is iOS's own presentation, it is seen once, and neither of
         these colours is load-bearing for the icon. -->
    <meta name="theme-color" content="#fbfaf8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PackProphet" />
    <!-- No PackProphet.styles.css link. That bundle is Blazor's scoped-CSS output, and it is only
         emitted when something in the build actually has scoped CSS: a .razor.css file here, or a
         referenced component library that ships one. Dropping the unused Blazor.Bootstrap package
         removed the last of those, so the file stopped being generated while the link stayed --
         a 404 on every page load, on every route. Add the link back alongside the first
         .razor.css file, not before. -->
    <script type="importmap"></script>
    <!-- Loaded in the head, before anything paints: it reads the saved theme and skin and stamps
         data-bs-theme and data-pp-skin on the root element, so a dark-mode user never sees a white
         flash on cold start and nobody sees the wrong palette for a frame. -->
    <script src="js/theme.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred. The details are in the red panel at the bottom.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/diag.js"></script>
    <script src="js/tooltip.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/undo.js"></script>
    <script src="js/persist.js"></script>
    <script src="js/countentry.js"></script>
    <script src="js/scroll.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <!-- The More menu is a native popover, so light dismiss and Escape are free. Following a link
         inside it is not a dismiss, though: Blazor routes in place, the popover has no idea the
         page changed, and it would sit open over the destination. One delegated listener closes
         it, rather than wiring an onclick to each of eight links. -->
    <script>
        document.addEventListener('click', e => {
            const item = e.target.closest('[popover].nav-more a, [popover].nav-more button');
            if (!item) return;
            const menu = item.closest('[popover].nav-more');
            if (menu && menu.matches(':popover-open')) menu.hidePopover();
        });
    </script>

    <!-- A popover is in the top layer, so it is positioned against the viewport and cannot ask its
         opener where it is: CSS alone can pin it to a screen edge and nothing else. Pinned right,
         the desktop menu opened at the far corner while its button sits fifth from the left, which
         reads as an unrelated panel rather than that button's menu.

         Anchor positioning would do this in CSS, and is not yet safe to rely on across the
         browsers this has to work in. So the opener's own left edge is measured on the way open
         and handed to the stylesheet as a custom property; the sheet still decides whether to use
         it, which is how the phone keeps its bottom sheet. Measured at beforetoggle so the value
         is set before the first paint of the open state. -->
    <script>
        document.addEventListener('beforetoggle', e => {
            const menu = e.target;
            if (e.newState !== 'open' || !menu.matches || !menu.matches('[popover].nav-more')) return;

            const opener = document.querySelector('[popovertarget="' + menu.id + '"]');
            if (!opener) return;

            const box = opener.getBoundingClientRect();
            menu.style.setProperty('--open-x', box.left + 'px');
            menu.style.setProperty('--open-y', box.bottom + 'px');
        }, true);
    </script>

    <!-- Resolved against the BASE href, not the current URL. A deep link like /packs is served
         index.html by the Pages 404 fallback, so a bare relative path would register
         /packs/service-worker.js — a 404, and a scope that covers nothing. -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(new URL('service-worker.js', document.baseURI))
                .catch(err => console.warn('Service worker registration failed', err));
        }
    </script>
</body>

</html>
